<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Saba!!!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: radial-gradient(circle, #1a1c2e 0%, #0c0f1d 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            /* თავიდან ვმალავთ სქროლს, რომ ყუთის გახსნამდე დაბლა არ ჩავიდეს */
            overflow-y: hidden; 
        }

        /* პირველი გვერდი - ყუთის სექცია */
        .section-welcome {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            position: relative;
        }

        /* საჩუქრის მთავარი კონტეინერი */
        .gift-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gift-wrapper:hover {
            transform: scale(1.03);
        }

        /* ყუთის თავსახური */
        .gift-lid {
            width: 220px;
            height: 45px;
            background: #e63946;
            border-radius: 4px;
            position: relative;
            z-index: 10;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            transform-origin: bottom right;
            transition: transform 1s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.8s ease;
        }

        /* ბაფთა თავსახურზე */
        .gift-lid::before {
            content: '';
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 18px;
            background: #ffb703;
            border-radius: 12px 12px 0 0;
        }

        /* ვერტიკალური ლენტი თავსახურზე */
        .lid-ribbon {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 100%;
            background: #ffb703;
        }

        /* ყუთის ძირითადი ტანი */
        .gift-box-body {
            width: 200px;
            height: 190px;
            background: #1d3557;
            position: relative;
            z-index: 5;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        /* ლენტი ყუთის ტანზე */
        .body-ribbon {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 100%;
            background: #ffb703;
        }

        /* ფოტოების გალერეა */
        .photo-gallery {
            position: absolute;
            width: 280px;
            height: 280px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 10px;
            padding: 10px;
            background: #ffffff;
            border-radius: 16px;
            z-index: 2;
            top: 0;
            opacity: 0;
            transform: scale(0.1) rotate(0deg);
            transition: transform 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;
            box-shadow: 0 10px 40px rgba(255, 183, 3, 0.4);
        }

        .photo-gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #f1faee;
        }

        /* მილოცვის ტექსტი */
        .wishes-text {
            position: absolute;
            bottom: -90px;
            color: #ffffff;
            font-size: 2.6rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 2px;
            opacity: 0;
            transform: scale(0.4);
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1s;
            text-shadow: 0 0 12px #e63946, 0 0 25px #e63946;
            white-space: nowrap;
            z-index: 10;
        }

        /* მინიშნება ჩამოსქროლვაზე (თავიდან დამალულია) */
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            color: #ffb703;
            font-size: 1.1rem;
            font-weight: bold;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 2.5s;
            text-align: center;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* ანიმაციის კლასები გახსნისას */
        .gift-wrapper.is-opened .gift-lid {
            transform: translateY(-180px) rotate(45deg) scale(0.8);
            opacity: 0;
        }

        .gift-wrapper.is-opened .photo-gallery {
            opacity: 1;
            transform: translateY(-240px) scale(1.25) rotate(-3deg);
        }

        .gift-wrapper.is-opened .wishes-text {
            opacity: 1;
            transform: scale(1);
            bottom: -150px;
        }

        /* მეორე სექცია - სქროლის შიგთავსი */
        .section-content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #0c0f1d;
            opacity: 0;
            transition: opacity 1.5s ease 1.5s;
        }

        /* როცა ყუთი იხსნება, ეს ბლოკიც ხდება ხილვადი */
        body.revealed .section-content {
            opacity: 1;
        }

        .wishes-card {
            background: rgba(29, 53, 87, 0.6);
            border: 2px solid #ffb703;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #f1faee;
        }

        .wishes-card h2 {
            color: #ffb703;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,183,3,0.3);
        }

        .wishes-card p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        /* ბურთების (Balloons) სტილები */
        .party-balloon {
            position: absolute;
            width: 30px;
            height: 38px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
        }

        .party-balloon::before {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 6px solid currentColor;
        }

        @keyframes balloonExplosion {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            15% { opacity: 0.95; }
            100% { transform: translate(var(--x), var(--y)) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="birthday-track" src="https://assets.mixkit.co/active_storage/sfx/2704/2704-84.wav" preload="auto" loop></audio>

    <div class="section-welcome">
        <div class="gift-wrapper" id="portalGiftBox" onclick="triggerOpening()">
            <div class="gift-lid">
                <div class="lid-ribbon"></div>
            </div>
            <div class="gift-box-body">
                <div class="body-ribbon"></div>
            </div>
            
            <div class="photo-gallery">
                <img src="https://images2.imgbox.com/7c/49/vjJ6mD6U_o.jpg" alt="Saba 1">
                <img src="https://images2.imgbox.com/39/10/lI0tZ36b_o.jpg" alt="Saba 2">
                <img src="https://images2.imgbox.com/a4/bf/PAnr8YvB_o.jpg" alt="Saba 3">
                <img src="https://images2.imgbox.com/15/8e/3g6oWz8m_o.jpg" alt="Saba 4">
            </div>

            <div class="wishes-text">Happy Birthday Saba!!! 🎉</div>
        </div>

        <div class="scroll-hint" id="scrollHint">⬇ ჩამოისქროლე დაბლა ⬇</div>
    </div>

    <div class="section-content" id="detailsSection">
        <div class="wishes-card">
            <h2>გილოცავ საბა! 🎂</h2>
            <p>გისურვებ დიდ წარმატებებს, დასახული მიზნების მიღწევას და ყოველივე საუკეთესოს ცხოვრებაში! ✨</p>
            <p>დაე, ეს წელი ყოფილიყოს შენთვის ახალი შესაძლებლობების, ბედნიერებისა და დიდი წინსვლის მომტანი! 🚀</p>
            <p>Happy Birthday! 🥳🎉</p>
        </div>
    </div>

    <script>
        function triggerOpening() {
            const box = document.getElementById('portalGiftBox');
            const track = document.getElementById('birthday-track');
            const hint = document.getElementById('scrollHint');
            
            if (box.classList.contains('is-opened')) return;

            box.classList.add('is-opened');
            
            // ვრთავთ სქროლს და ვამჟღავნებთ ქვედა სექციას
            document.body.style.overflowY = 'auto';
            document.body.classList.add('revealed');
            
            // ვაჩენთ ჩამოსქროლვის ტექსტს
            hint.style.opacity = '1';
            hint.style.transform = 'translateY(0)';

            // მუსიკის გაშვება
            track.play().catch(err => console.log("Audio blocked"));

            // ბურთების გაშვება
            launchBalloons();

            // ავტომატური სქროლი ქვემოთ 3 წამის შემდეგ (სურვილისამებრ)
            setTimeout(() => {
                document.getElementById('detailsSection').scrollIntoView({ behavior: 'smooth' });
            }, 3500);
        }

        function launchBalloons() {
            const container = document.getElementById('portalGiftBox');
            const palette = ['#ff4d6d', '#ffb703', '#2a9d8f', '#457b9d', '#9b5de5', '#f15bb5', '#00f5d4'];
            
            for (let i = 0; i < 55; i++) {
                const b = document.createElement('div');
                b.classList.add('party-balloon');
                
                const pickedColor = palette[Math.floor(Math.random() * palette.length)];
                b.style.backgroundColor = pickedColor;
                b.style.color = pickedColor;
                b.style.boxShadow = `inset -3px -3px 8px rgba(0,0,0,0.2), 0 0 12px ${pickedColor}`;

                const targetX = (Math.random() - 0.5) * 700;
                const targetY = -(Math.random() * 450 + 200);

                b.style.setProperty('--x', `${targetX}px`);
                b.style.setProperty('--y', `${targetY}px`);

                b.style.left = '95px';
                b.style.top = '90px';
                
                b.style.animation = `balloonExplosion ${Math.random() * 1.6 + 1.4}s cubic-bezier(0.1, 0.8, 0.25, 1) forwards`;

                container.appendChild(b);

                setTimeout(() => { b.remove(); }, 3000);
            }
        }
    </script>
</body>
</html>
